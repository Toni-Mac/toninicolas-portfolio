content:
  - name: site
    label: "Site Content"
    type: file
    path: _data/site.yml
    fields:
      - name: nav
        label: "Navigation"
        type: object
        fields:
          - { name: cv_url, label: "Resume PDF (upload a new file here to replace — update this often)", type: file }          
          - { name: email, label: "Contact Email", type: string }
          - { name: linkedin_url, label: "LinkedIn URL", type: string }
      - name: hero
        label: "Hero Section"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow label", type: string }
          - { name: headline, label: "Headline (HTML allowed, e.g. <br>)", type: string }
          - { name: subhead, label: "Subheading", type: text }
          - { name: bullets, label: "Bullet points", type: string, list: true }
          - { name: strengths_label, label: "Strengths card label", type: string }
          - { name: strengths, label: "Core strengths list", type: string, list: true }
      - name: about
        label: "About Section"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow label", type: string }
          - { name: photo, label: "Headshot", type: image }
          - { name: paragraphs, label: "Paragraphs", type: text, list: true }
          - { name: industries, label: "Industry tags", type: string, list: true }
          - name: highlights
            label: "Highlights"
            type: object
            list: true
            fields:
              - { name: label, label: "Bold label", type: string }
              - { name: text, label: "Description", type: string }
      - name: contact
        label: "Contact Section"
        type: object
        fields:
          - { name: eyebrow, label: "Eyebrow label", type: string }
          - { name: headline, label: "Headline", type: text }
          - { name: email, label: "Email", type: string }
          - { name: linkedin_url, label: "LinkedIn URL", type: string }
          - { name: location_line, label: "Footer line", type: string }

  - name: work
    label: "Work / Case Studies"
    type: collection
    path: _work
    format: yaml-frontmatter
    filename: "{fields.order}-{fields.title}.md"
    view:
      fields: [title, tag, url]
      primary: title
      sort: [order]
    fields:
      - { name: order, label: "Display order (1, 2, 3…)", type: number }
      - { name: number, label: "Number badge shown on card (e.g. 01)", type: string }
      - { name: url, label: "Case study link — edit this to update where the card goes", type: string }
      - { name: tag, label: "Category tag", type: string }
      - { name: title, label: "Title", type: string }
      - { name: description, label: "Description", type: text }
      - name: stats
        label: "Stats"
        type: object
        list: true
        fields:
          - { name: value, label: "Value (e.g. 79%)", type: string }
          - { name: label, label: "Label", type: string }

  - name: experience
    label: "Experience"
    type: file
    path: _data/experience.yml
    fields:
      - name: items
        label: "Positions"
        type: object
        list: true
        fields:
          - { name: title, label: "Job Title", type: string }
          - { name: company, label: "Company", type: string }
          - { name: dates, label: "Dates", type: string }

media:
  input: assets
  output: /assets
